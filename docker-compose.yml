# =============================================================================
# Docker Compose — LLM RAG Performance Analytics
# =============================================================================
# Start with: docker compose up -d
#
# Services:
#   - qdrant: Vector database (stores document embeddings)
#
# NOTE: Ollama runs NATIVELY (not in Docker) for direct GPU access.
#   Install: curl -fsSL https://ollama.com/install.sh | sh
#   Start:   ollama serve
#   Pull:    ollama pull llama3.1:8b
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Qdrant — Vector Database
  # ---------------------------------------------------------------------------
  # Think of it as a "smart search engine" for your documents.
  # Instead of searching by keywords, it searches by MEANING.
  # Your documents get converted to vectors (numbers) and stored here.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC (faster, used by client library)
    volumes:
      - qdrant_data:/qdrant/storage    # persist data between restarts
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      # The Qdrant image does not ship curl/wget.  A TCP check via bash is
      # enough here: the container is healthy when the REST port accepts
      # connections.  Using the API path would require installing a client.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 3

# Named volumes — Docker manages the storage location
volumes:
  qdrant_data:
