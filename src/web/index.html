<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Performance Analytics</title>
    <meta name="description" content="Compare local vs cloud LLMs using Retrieval-Augmented Generation">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
    <!-- ===== TOP BAR ===== -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="logo-icon">⚡</span>
            <span class="logo-text">RAG Analytics</span>
        </div>

        <div class="topbar-controls">
            <div class="control-group">
                <label class="control-label">Language</label>
                <div class="toggle-group">
                    <button class="toggle-btn active" data-lang="en">EN</button>
                    <button class="toggle-btn" data-lang="pl">PL</button>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Chunks</label>
                <div class="slider-wrap">
                    <input type="range" id="top-k-slider" min="1" max="15" value="5" class="slider">
                    <span id="top-k-value" class="slider-value">5</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Panels</label>
                <div class="panel-count-group">
                    <button class="panel-count-btn" data-count="1">1</button>
                    <button class="panel-count-btn active" data-count="2">2</button>
                    <button class="panel-count-btn" data-count="3">3</button>
                    <button class="panel-count-btn" data-count="4">4</button>
                </div>
            </div>
        </div>

        <div class="topbar-stats">
            <span id="queries-count">0</span> queries
        </div>
    </header>

    <!-- ===== PANELS GRID ===== -->
    <main class="panels-container" id="panels-container" data-count="2">
        <!-- Panels are created dynamically by JS -->
    </main>

    <!-- ===== SHARED INPUT ===== -->
    <footer class="input-area">
        <div class="example-bar" id="example-bar">
            <button class="example-btn" data-q="What is photosynthesis?">What is photosynthesis?</button>
            <button class="example-btn" data-q="Who wrote Romeo and Juliet?">Who wrote Romeo and Juliet?</button>
            <button class="example-btn" data-q="What is the speed of light?">What is the speed of light?</button>
            <button class="example-btn" data-q="How does the human heart work?">How does the human heart work?</button>
        </div>
        <form id="query-form" class="input-form">
            <input type="text" id="question-input" placeholder="Ask a question — it goes to all panels simultaneously..." autocomplete="off" required>
            <button type="submit" id="submit-btn" class="send-btn">
                <span class="send-icon">→</span>
            </button>
        </form>
    </footer>

    <script src="/js/app.js?v=2"></script>
</body>
</html>
