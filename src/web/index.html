<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Performance Analytics</title>
    <meta name="description" content="Compare local vs cloud LLMs using Retrieval-Augmented Generation">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=9">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- ===== TOP BAR ===== -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="logo-text">RAG Analytics</span>
        </div>

        <div class="topbar-controls">
            <!-- Tab switcher -->
            <div class="control-group">
                <div class="tab-group">
                    <button class="tab-btn active" data-tab="chat">💬 Chat</button>
                    <button class="tab-btn" data-tab="analytics">📊 Analytics</button>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Language</label>
                <div class="toggle-group">
                    <button class="toggle-btn active" data-lang="en">EN</button>
                    <button class="toggle-btn" data-lang="pl">PL</button>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Chunks</label>
                <div class="slider-wrap">
                    <input type="range" id="top-k-slider" min="1" max="15" value="5" class="slider">
                    <span id="top-k-value" class="slider-value">5</span>
                </div>
            </div>

            <!-- RAG Config -->
            <div class="control-group">
                <label class="control-label">RAG Config</label>
                <select id="rag-config-select" class="topbar-select">
                    <option value="basic-512">Basic 512</option>
                </select>
            </div>

            <!-- Dataset -->
            <div class="control-group">
                <label class="control-label">Dataset</label>
                <select id="dataset-select" class="topbar-select">
                    <option value="wiki">Wikipedia</option>
                    <option value="squad">SQuAD</option>
                    <option value="trivia">TriviaQA</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">Panels</label>
                <div class="panel-count-group">
                    <button class="panel-count-btn" data-count="1">1</button>
                    <button class="panel-count-btn active" data-count="2">2</button>
                    <button class="panel-count-btn" data-count="3">3</button>
                    <button class="panel-count-btn" data-count="4">4</button>
                </div>
            </div>

            <!-- Auto Test -->
            <div class="control-group">
                <label class="control-label">Auto Test</label>
                <div class="autotest-group">
                    <select id="test-set-select" class="autotest-select">
                        <option value="">Loading...</option>
                    </select>
                    <select id="test-count-select" class="autotest-select autotest-count">
                        <option value="5">5 Q</option>
                        <option value="10" selected>10 Q</option>
                        <option value="20">20 Q</option>
                        <option value="30">30 Q</option>
                        <option value="50">50 Q</option>
                    </select>
                    <button id="autotest-btn" class="autotest-btn" disabled>▶ Run</button>
                    <button id="autotest-stop-btn" class="autotest-stop-btn hidden">⏹ Stop</button>
                </div>
            </div>

            <button class="reset-btn" id="reset-btn" title="Reset all chats and analytics">🗑️ Reset</button>
        </div>

        <div class="topbar-stats">
            <span id="queries-count">0</span> queries
            <span id="autotest-progress" class="hidden"></span>
        </div>
    </header>

    <!-- ===== CHAT VIEW ===== -->
    <main class="panels-container" id="chat-view" data-count="2">
    </main>

    <!-- ===== ANALYTICS VIEW ===== -->
    <main class="panels-container hidden" id="analytics-view" data-count="2">
    </main>
    <div class="report-bar hidden" id="report-bar">
        <button id="download-report-btn" class="download-report-btn">📥 Download Report</button>
    </div>

    <!-- ===== SHARED INPUT ===== -->
    <footer class="input-area" id="input-area">
        <div class="example-bar" id="example-bar">
            <button class="example-btn" data-q="What is photosynthesis?">What is photosynthesis?</button>
            <button class="example-btn" data-q="Who wrote Romeo and Juliet?">Who wrote Romeo and Juliet?</button>
            <button class="example-btn" data-q="What is the speed of light?">What is the speed of light?</button>
            <button class="example-btn" data-q="How does the human heart work?">How does the human heart work?</button>
        </div>
        <form id="query-form" class="input-form">
            <input type="text" id="question-input" placeholder="Ask a question — it goes to all panels simultaneously..." autocomplete="off" required>
            <button type="submit" id="submit-btn" class="send-btn">
                <span class="send-icon">→</span>
            </button>
        </form>
    </footer>

    <script src="/js/app.js?v=9"></script>
</body>
</html>
