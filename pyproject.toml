[project]
name = "llm-rag-performance-analytics"
version = "0.1.0"
description = "Performance benchmark and evaluation of local vs. cloud LLMs using Retrieval-Augmented Generation"
requires-python = ">=3.12"
dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # --- RAG & LLM ---
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mistralai>=0.2.0",
    "langchain-qdrant>=0.2.0",
    # --- Vector DB ---
    "qdrant-client>=1.12.0",
    # --- Embeddings ---
    "sentence-transformers>=3.0.0",
    # --- Evaluation ---
    "ragas>=0.2.0",
    # --- Data processing ---
    "datasets>=3.0.0",            # HuggingFace datasets (for Natural Questions)
    "pandas>=2.2.0",
    # --- Visualization ---
    "plotly>=5.24.0",
    "matplotlib>=3.9.0",
    # --- Configuration ---
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    # --- Utilities ---
    "httpx>=0.27.0",
    "rich>=13.9.0",               # Pretty console output
    "langchain-text-splitters>=1.1.2",
    "langchain-ollama>=1.1.0",
]

[project.scripts]
# Lets you run the app with: uv run rag-analytics
rag-analytics = "src.api.main:start"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",  # sprawdza czy kod jest ładnie i porpawnie napisany
    "pre-commit>=4.0.0", # automatycznie sprawdza kod przed commitem na githuba.
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
